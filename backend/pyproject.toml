[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floatwise"
version = "0.1.0"
description = "AI agent liquidity forecaster for upay (AI Hackathon 2026, DIU CPC x upay)"
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.6",
    "numpy==2.4.6",
    "pyarrow==25.0.1",
    "lightgbm==4.7.0",
    "shap==0.51.0",
    "scikit-learn==1.9.1",
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "anthropic==1.11.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["floatwise*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
